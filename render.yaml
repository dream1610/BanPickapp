services:
  - type: web
    name: gdreed-draft-console
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gdreed-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: gdreed-postgres
    plan: free
    databaseName: gdreed
    user: gdreed
